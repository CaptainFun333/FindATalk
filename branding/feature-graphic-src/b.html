<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:radial-gradient(ellipse 70% 100% at 78% 50%,#faf7ee 0%,#f3efe2 60%,#ebe4cf 100%);--word:#a9822f;--h1:#1c2c42;--h2:#6e2b34;--rule:#a9822f;--p:#3d4d64}
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
body{background:var(--bg);font-family:Georgia,serif;position:relative}
.copy{position:absolute;left:64px;top:0;height:500px;width:580px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}

.brand img{width:64px;height:64px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.brand span{font-size:30px;font-weight:bold;color:var(--word);letter-spacing:.2px}
h1{font-size:40px;line-height:1.1;font-weight:bold;color:var(--h1);letter-spacing:-.5px}
h2{font-size:29px;font-style:italic;font-weight:normal;color:var(--h2);margin-top:16px;letter-spacing:.1px}
h1 em{color:#d9be8a;font-style:italic}
.rule{width:96px;height:2px;background:var(--rule);margin:24px 0 18px}
p{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:21px;color:var(--p);letter-spacing:.2px}
.phone{position:absolute;left:672px;top:40px;width:278px;height:560px;border-radius:44px;background:#0d1117;padding:9px;box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 0 2px #3a4452 inset}
.screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#f3eee2}
.screen img{width:100%;display:block}
</style></head><body>
<div class="copy">
<div class="brand"><img src="pulpit.png"><span>FindATalk</span></div>
<h1>The message you<br>didn't know you needed.</h1>
<h2>Your daily word from the Lord's servants.</h2>
<div class="rule"></div>
<p>Free. Simple. A joy to come back to.</p>
</div>
<div class="phone"><div class="screen"><img src="home.png"></div></div>
</body></html>
